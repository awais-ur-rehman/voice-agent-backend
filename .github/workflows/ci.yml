name: Backend verification

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main, develop, 'feat/phase-4-dashboard', 'feat/phase-5-knowledge', 'feat/phase-6-analytics']

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python tests/run_offline.py
      - run: python -m evaluation --dry-run
      - run: python -m evaluation.flows --dry-run
      - run: python -m evaluation.flows --dry-run --fixture-set all
      - run: python -m evaluation.flows --dry-run --fixture-set all --action-policy state_constrained
      - run: python -m evaluation.flows --suite confirmations
      - run: python -m evaluation.assets

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: voice_agent_test
          POSTGRES_PASSWORD: phase1_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d voice_agent_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RECOVERY_SQL_TEST: '1'
      TEST_VALKEY_URL: valkey://:phase2_valkey_test_only@127.0.0.1:56379/0
      TEST_DATABASE_URL: postgresql+psycopg://postgres:phase1_test_only@127.0.0.1:5432/voice_agent_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://scheduler_app:phase1_app_test_only@127.0.0.1:5432/voice_agent_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.10
      - run: docker run -d --name valkey-test -p 56379:6379 valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a valkey-server --requirepass phase2_valkey_test_only --save "" --appendonly no
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy scheduler brain knowledge knowledge_worker analytics analytics_worker
      - run: uv run --no-sync mypy --follow-untyped-imports embedding_service scripts/qualify_knowledge.py
      - run: uv run --no-sync mypy --explicit-package-bases scripts/recovery.py scripts/recovery_bundle.py scripts/recovery_database.py
      - run: uv run --no-sync python -m scripts.export_voice_contracts --check
      - run: uv run --no-sync python -m scripts.export_agent_contracts --check
      - run: uv run --no-sync python -m scripts.export_dashboard_contracts --check
      - run: uv run --no-sync python -m pytest

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target runtime -t clinic-runtime:test .
      - run: docker run --rm --network none clinic-runtime:test uv run --no-sync python -c 'from brain.voice_catalog import catalog; from brain.agent_config import AgentConfig; assert len(catalog()) == 12; assert AgentConfig().schema_version == 2'

      - run: docker run --rm --network none clinic-runtime:test uv run --no-sync python -c 'import importlib.util; import scheduler.main; assert not any(importlib.util.find_spec(m) for m in ["pypdf", "defusedxml", "tokenizers", "onnxruntime", "psutil"])'
      - run: docker build --target knowledge-worker -t clinic-knowledge-worker:test .
      - run: docker run --rm --network none clinic-knowledge-worker:test uv run --no-sync python -m knowledge_worker.main --once
      - run: docker run --rm --network none clinic-knowledge-worker:test uv run --no-sync python -c 'from knowledge.parsing import parse_bytes; from knowledge_worker.runner import process_job; assert parse_bytes(b"Open weekdays", "txt").text == "Open weekdays"'

      - run: docker build --target analytics-worker -t clinic-analytics-worker:test .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:size=16m --cap-drop ALL --security-opt no-new-privileges:true -e UV_CACHE_DIR=/tmp/uv-cache clinic-analytics-worker:test uv run --no-sync python -m analytics_worker.main --once
      - run: docker run --rm --network none clinic-analytics-worker:test uv run --no-sync python -c 'import importlib.util; import analytics.aggregation; assert not any(importlib.util.find_spec(m) for m in ["pypdf", "defusedxml", "tokenizers", "onnxruntime", "psutil"])'

      - run: docker build --target embedding -t clinic-embedding:test .
      - run: docker run --rm --network none --entrypoint /app/.venv/bin/python clinic-embedding:test -c 'import sys; from pathlib import Path; from embedding_service.server import create_app; from embedding_service.settings import Settings; settings=Settings(Path("/missing"),"synthetic-image-test-secret-over-32-characters"); app=create_app(settings); assert not settings.enabled; assert "onnxruntime" not in sys.modules and "tokenizers" not in sys.modules'

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.10
      - run: uv sync --project voice --locked --all-groups
      - run: uv lock --project voice/inference --check
      - run: uv run --project voice --locked pytest voice/tests
