name: voice-agent-phase1

x-api-image: &api-image
  image: voice-agent-phase1-api:local
  build:
    context: .
    target: runtime

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: voice_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  init-db:
    <<: *api-image
    environment:
      SCHEDULER_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${DEV_ADMIN_PASSWORD:-}@postgres:5432/voice_agent
      SCHEDULER_APP_PASSWORD: ${DEV_APP_PASSWORD:-}
    command: ["uv", "run", "--no-sync", "python", "-m", "scripts.init_db"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *api-image
    environment:
      SCHEDULER_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${DEV_ADMIN_PASSWORD:-}@postgres:5432/voice_agent
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      init-db:
        condition: service_completed_successfully

  api:
    <<: *api-image
    volumes:
      - knowledge-private-data:/var/lib/knowledge
    environment:
      SCHEDULER_DATABASE_URL: postgresql+psycopg://scheduler_app:${DEV_APP_PASSWORD:-}@postgres:5432/voice_agent
      SCHEDULER_JWT_SECRET: ${SCHEDULER_JWT_SECRET:-}
      SCHEDULER_RUNTIME_SECRET: ${SCHEDULER_RUNTIME_SECRET:-}
      SCHEDULER_REGISTRATION_ENABLED: ${SCHEDULER_REGISTRATION_ENABLED:-false}
      SCHEDULER_KNOWLEDGE_ENABLED: ${SCHEDULER_KNOWLEDGE_ENABLED:-false}
      SCHEDULER_KNOWLEDGE_BLOB_SECRET: ${KNOWLEDGE_BLOB_SECRET:-}
      SCHEDULER_KNOWLEDGE_BLOB_ROOT: /var/lib/knowledge
      SCHEDULER_VOICE_ENABLED: ${SCHEDULER_VOICE_ENABLED:-false}
      SCHEDULER_VOICE_BOOTSTRAP_SECRET: ${SCHEDULER_VOICE_BOOTSTRAP_SECRET:-}
      SCHEDULER_VOICE_WORKER_SECRET: ${SCHEDULER_VOICE_WORKER_SECRET:-}
      SCHEDULER_LIVEKIT_API_KEY: ${SCHEDULER_LIVEKIT_API_KEY:-}
      SCHEDULER_LIVEKIT_API_SECRET: ${SCHEDULER_LIVEKIT_API_SECRET:-}
      SCHEDULER_LIVEKIT_API_URL: http://livekit:7880
      SCHEDULER_LIVEKIT_URL: ws://127.0.0.1:7880
      SCHEDULER_LLM_API_KEY: ${LLM_API_KEY:-}
      SCHEDULER_VALKEY_URL: valkey://:${DEV_VALKEY_PASSWORD:-}@valkey:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  livekit:
    profiles: ["voice"]
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: ["--config", "/etc/livekit.json"]
    volumes:
      - type: bind
        source: ./.local/livekit.json
        target: /etc/livekit.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  valkey:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    environment:
      VALKEY_PASSWORD: ${DEV_VALKEY_PASSWORD:-}
    command: ["sh", "-ec", 'test -n "$$VALKEY_PASSWORD"; exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save "" --appendonly no']
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey-test:
    profiles: ["test"]
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    environment:
      VALKEY_PASSWORD: phase2_valkey_test_only
    command: ["sh", "-ec", 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save "" --appendonly no']
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: voice_agent_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: phase1_test_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_agent_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  knowledge-private-data:
  postgres-dev-data:
