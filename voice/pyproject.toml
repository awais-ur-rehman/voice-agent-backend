[project]
name = "clinic-voice-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "pipecat-ai[livekit]==1.14.0", "livekit==1.2.0", "livekit-api==1.2.2",
 "httpx==0.28.1", "numpy==1.26.4", "psutil==7.2.2", "huggingface-hub==0.36.0", "python-dotenv==1.2.1", "soxr==1.0.0"
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.3"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/voice_runtime"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.hatch.metadata]
allow-direct-references = true
[tool.ruff]
target-version = "py312"
line-length = 100
include = ["**/*.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
