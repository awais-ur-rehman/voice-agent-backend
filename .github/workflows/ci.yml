name: CPU evaluation

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python tests/run_offline.py
      - run: python -m evaluation --dry-run
      - run: python -m evaluation.flows --dry-run
      - run: python -m evaluation.flows --suite confirmations
      - run: python -m evaluation.assets
